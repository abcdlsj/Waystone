[workspace]
resolver = "2"
members = [
  "crates/waystone-proto",
  "crates/waystone-rtc",
  "crates/waystoned",
  "host/macos/waystone-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/abcdlsj/Waystone"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rustls = "0.23"
rustls-pemfile = "2"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
ed25519 = { version = "2", features = ["pkcs8", "pem"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
