name: Waystone
options:
  bundleIdPrefix: dev.waystone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES

targets:
  Waystone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Waystone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.waystone.app
        INFOPLIST_FILE: Waystone/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Waystone/Transport/Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/include
        ENABLE_BITCODE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - framework: Vendor/WaystoneRTC.xcframework
        embed: false
        codeSign: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: VisionKit.framework
      - sdk: Security.framework

  WaystoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaystoneTests
      - path: Waystone/Models
      - path: Waystone/Transport/Transport.swift
      - path: Waystone/Media/VideoDecoder.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.waystone.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Waystone/Transport/Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/include
    dependencies:
      - target: Waystone
      - framework: Vendor/WaystoneRTC.xcframework
        embed: false
        codeSign: false

schemes:
  Waystone:
    build:
      targets:
        Waystone: all
        WaystoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WaystoneTests
