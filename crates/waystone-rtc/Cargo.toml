[package]
name = "waystone-rtc"
description = "Shared WebRTC session, ICE and adaptive bitrate plumbing for Waystone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "waystone_rtc"
crate-type = ["rlib", "staticlib"]

[dependencies]
waystone-proto = { path = "../waystone-proto" }
base64 = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
if-addrs = "0.15"
socket2 = "0.6"
crab_nat = { version = "0.8", optional = true }
tokio = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Router port mappings (UPnP IGD, PCP, NAT-PMP) for hosts. Off for iOS, where
# multicast needs an entitlement and a phone is never the side to map.
port-mapping = ["dep:crab_nat"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
